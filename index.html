<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="寻迹 · 收纳保质期记录（单机本地版）" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="寻迹" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="mobile.css?v=2.32" />
  <title>寻迹 · 收纳清单</title>
</head>
<body>
  <!-- 桌面显示手机外框，手机端全屏 -->
  <div class="device-frame">
    <div class="device-screen">
      <div class="app-shell">
        <header class="app-header" id="app-header"></header>
        <main class="app-view" id="app-view"></main>
        <nav class="bottom-nav" id="bottom-nav"></nav>
      </div>
      <div id="sheet-root"></div>
      <div id="overlay-root"></div>
      <div id="toast-root" class="toast-root"></div>
    </div>
  </div>

  <!-- 仅保留纯前端逻辑：无任何后端 / 社交 / 云端 SDK -->
  <script src="mobile.js?v=2.32"></script>
  <script>
    // PWA 安装事件捕获（供「安装到桌面」按钮调用）
    window.__organizerInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__organizerInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__organizerInstallPrompt = null;
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js?v=2.32', { updateViaCache: 'none' }).then(function (reg) {
          if (reg && typeof reg.update === 'function') reg.update();
          if (reg) reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (nw) nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage({ type: 'SKIP_WAITING' });
            });
          });
        }).catch(function () {});
      });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (window.__xunjiReloading) return;
        window.__xunjiReloading = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
